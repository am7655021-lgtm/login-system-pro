<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Northstar Supply | Private Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="auth-page">
        <section class="auth-panel">
            <div class="brand-mark">NS</div>
            <p class="eyebrow">Private member store</p>
            <h1>Good things,<br><em>well chosen.</em></h1>
            <p class="auth-intro">Sign in to browse Northstar Supply's considered collection of everyday technology.</p>

            <div class="auth-tabs" role="tablist">
                <button class="auth-tab active" type="button" data-auth-mode="login">Log in</button>
                <button class="auth-tab" type="button" data-auth-mode="register">Create account</button>
            </div>
            <form id="authForm" class="auth-form">
                <label for="authEmail">Email address</label>
                <input type="email" id="authEmail" autocomplete="email" placeholder="you@example.com" required>
                <label for="authPassword">Password</label>
                <input type="password" id="authPassword" autocomplete="current-password" placeholder="At least 6 characters" required minlength="6">
                <button class="btn-primary auth-submit" type="submit"><span id="authSubmitText">Enter the store</span><span aria-hidden="true">&rarr;</span></button>
                <p id="authMessage" class="form-message" role="status"></p>
            </form>
        </section>
        <aside class="auth-aside">
            <span>01 / 03</span>
            <p>Tools for a more<br><strong>intentional</strong> setup.</p>
        </aside>
    </main>
    <script src="script.js"></script>

</body>
</html>
