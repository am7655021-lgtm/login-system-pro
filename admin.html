<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | NovaStream</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* تنسيق سريع للوحة التحكم */
        .admin-container { padding: 50px 10%; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: #161b2a; padding: 20px; border-radius: 10px; border-left: 5px solid #6366f1; }
        table { width: 100%; border-collapse: collapse; background: #161b2a; border-radius: 10px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #2d3343; }
        th { background: #1e293b; color: #6366f1; }
    </style>
</head>
<body>
    <div class="admin-container">
        <h1>Welcome Back, Admin</h1>
        <div class="stats-grid">
            <div class="stat-card"><h3>Total Users</h3><p id="total-users-count">0</p></div>
            <div class="stat-card"><h3>Total Messages</h3><p id="total-messages-count">0</p></div>
        </div>

        <section class="admin-product-manager">
            <div>
                <p class="eyebrow">Store inventory</p>
                <h2>Manage products</h2>
            </div>
            <form id="productForm" class="product-form">
                <label for="productTitle">Product Title</label>
                <input id="productTitle" name="title" type="text" required>
                <label for="productPrice">Price</label>
                <input id="productPrice" name="price" type="number" min="0" step="0.01" required>
                <label for="productDescription">Description</label>
                <textarea id="productDescription" name="description" rows="3"></textarea>
                <label for="productImageUrl">Image URL</label>
                <input id="productImageUrl" name="imageUrl" type="url" placeholder="https://...">
                <button class="btn-primary" type="submit">Add product <span>&rarr;</span></button>
                <p id="productFormMessage" class="form-message" role="status"></p>
            </form>
            <div>
                <h3>Current products</h3>
                <div id="adminProducts" class="admin-products"><p>No products available right now.</p></div>
            </div>
        </section>

        <h2>Recent Messages</h2>
        <table>
            <thead>
                <tr>
                    <th>User Email</th>
                    <th>Message</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="messages-table">
                </tbody>
        </table>
    </div>

    <script>
        // التأكد من تسجيل الدخول
if (localStorage.getItem('adminLoggedIn') !== 'true') {
    window.location.href = 'login.html';
}
        // كود بسيط لجلب البيانات من السيرفر الذي سننشئه
        async function loadStats() {
            try {
                const response = await fetch('/api/admin-stats');
                const data = await response.json();
                document.getElementById('total-users-count').innerText = data.totalUsers;
                document.getElementById('total-messages-count').innerText = data.totalMessages;
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }

        async function loadMessages() {
            const response = await fetch('/api/messages');
            const messages = await response.json();
            const tableBody = document.getElementById('messages-table');

            tableBody.innerHTML = messages.map(msg => `
                <tr>
                    <td>${msg.email}</td>
                    <td>${msg.message}</td>
                    <td>${new Date(msg.date).toLocaleDateString()}</td>
                </tr>
            `).join('');
        }
        loadStats();
        loadMessages();
    </script>
    <script src="script.js"></script>
</body>
</html>
