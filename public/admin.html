<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | NovaStream</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* تنسيق سريع للوحة التحكم */
        .admin-container { padding: 50px 10%; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: #161b2a; padding: 20px; border-radius: 10px; border-left: 5px solid #6366f1; }
        table { width: 100%; border-collapse: collapse; background: #161b2a; border-radius: 10px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #2d3343; }
        th { background: #1e293b; color: #6366f1; }
    </style>
</head>
<body>
    <div class="admin-container">
        <h1>Welcome Back, Admin</h1>
        <div class="stats-grid">
            <div class="stat-card"><h3>Total Messages</h3><p id="msg-count">0</p></div>
            <div class="stat-card"><h3>Total Revenue</h3><p>$1,250</p></div>
            <div class="stat-card"><h3>AI Queries</h3><p>452</p></div>
        </div>

        <h2>Recent Messages</h2>
        <table>
            <thead>
                <tr>
                    <th>User Email</th>
                    <th>Message</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="messages-table">
                </tbody>
        </table>
    </div>

    <script>
        // التأكد من تسجيل الدخول
if (localStorage.getItem('adminLoggedIn') !== 'true') {
    window.location.href = 'login.html';
}
        // كود بسيط لجلب البيانات من السيرفر الذي سننشئه
        async function loadMessages() {
            const response = await fetch('http://localhost:5000/api/messages');
            const messages = await response.json();
            const tableBody = document.getElementById('messages-table');
            document.getElementById('msg-count').innerText = messages.length;

            tableBody.innerHTML = messages.map(msg => `
                <tr>
                    <td>${msg.email}</td>
                    <td>${msg.message}</td>
                    <td>${new Date(msg.date).toLocaleDateString()}</td>
                </tr>
            `).join('');
        }
        loadMessages();
    </script>
</body>
</html>
