<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Admin Access</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-box {
            max-width: 400px;
            margin: 100px auto;
            background: #161b2a;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid #2d3343;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #0b0f19;
            border: 1px solid #2d3343;
            color: white;
            border-radius: 5px;
        }
        .btn-login {
            width: 100%;
            background: #6366f1;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Admin Login</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" class="btn-login">Enter Dashboard</button>
        </form>
        <p id="error" style="color: red; margin-top: 10px;"></p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            const response = await fetch('http://localhost:5000/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user, pass })
            });

            const result = await response.json();
            if(result.success) {
                // تخزين توكن بسيط (في الحقيقة نستخدم JWT لكن للتبسيط الآن سنستخدم localStorage)
                localStorage.setItem('adminLoggedIn', 'true');
                window.location.href = 'admin.html';
            } else {
                document.getElementById('error').innerText = "Wrong credentials!";
            }
        });
    </script>
</body>
</html>
